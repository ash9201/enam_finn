name: Live dependency feasibility
# Intentionally manual. Scheduled ingestion belongs to a later, gated milestone.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: One NSE symbol to verify end to end
        required: true
        default: INFY
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_LITE_MODEL: gemini-3.5-flash-lite
      GEMINI_REASONING_MODEL: gemini-3.8-flash
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FINN_DEPLOYED_API_URL: ${{ vars.FINN_DEPLOYED_API_URL }}
      FINN_DEPLOYED_WEB_URL: ${{ vars.FINN_DEPLOYED_WEB_URL }}
      PROBE_SYMBOL: ${{ inputs.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m finn.feasibility --symbol "$PROBE_SYMBOL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-0-feasibility
          path: |
            artifacts/milestone-0/feasibility.json
            artifacts/milestone-0/feasibility.md
          retention-days: 3
