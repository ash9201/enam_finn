[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-prototype"
version = "0.1.0"
description = "FINN milestone-zero dependency and deployment foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "python-dotenv>=1,<2",
  "yfinance>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

